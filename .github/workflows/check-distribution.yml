name: Check distribution boundary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject vendored engine assets
        run: python3 scripts/check-distribution.py
      - name: Run regression checks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check documentation
        run: python3 scripts/check-docs.py
